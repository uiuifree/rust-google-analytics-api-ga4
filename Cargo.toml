[package]
name = "google-analytics-api-ga4"
version = "0.3.1"
edition = "2021"

authors = ["uiuifree"]
description = "Async Rust client for the Google Analytics 4 (GA4) Data API v1beta: runReport, realtime reports, pivot reports, and metadata"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
keywords = ["ga4", "google-analytics", "analytics", "google-api", "reporting"]
categories = ["api-bindings", "web-programming"]

readme = "README.md"
repository = "https://github.com/uiuifree/rust-google-analytics-api-ga4"
documentation = "https://docs.rs/google-analytics-api-ga4"
[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }

# Json
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
#serde_derive = "1.0"


[dev-dependencies]
tokio = { version = "1.44.2", features = ["full"] }
yup-oauth2 = { version = "12.1.2", default-features = false, features = ["hyper-rustls", "service-account", "aws-lc-rs"] }
csv="1.1.6"